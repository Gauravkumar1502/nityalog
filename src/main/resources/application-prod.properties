gg.jte.development-mode=false
gg.jte.usePrecompiledTemplates=true

app.server.address=${APP_SERVER_ADDRESS}
app.server.scheme=${APP_SERVER_SCHEME:https}
app.server.port=${APP_SERVER_PORT:8080}

# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}


# JPA
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.defer-datasource-initialization=false

# Hibernate
spring.jpa.hibernate.ddl-auto=update
#spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Logging
logging.level.org.springframework=WARN


# =============================
# Gmail SMTP Mail Configuration
# =============================

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

# Enable authentication and TLS
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Optional: Debug logs for troubleshooting
spring.mail.properties.mail.debug=false

# Optional: Connection timeout settings
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# JWT Configuration
app.jwt.issuer=${RENDER_EXTERNAL_URL}
app.jwt.audience=${JWT_AUDIENCE:nityalog-frontend}
app.jwt.access-ttl=${JWT_ACCESS_TTL:15}
app.jwt.refresh-ttl=${JWT_REFRESH_TTL:14}
app.jwt.key-rotation-cron=${JWT_ROTATION_CRON:0 0 0 1 * *}

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
app.cors.allowed-headers=${CORS_ALLOWED_HEADERS:*}
app.cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:true}
app.cors.max-age=${CORS_MAX_AGE:3600}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email

# Remove these after test deployment
management.endpoints.web.exposure.include=health,info
