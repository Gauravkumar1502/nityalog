gg.jte.development-mode=false
gg.jte.usePrecompiledTemplates=true

server.address=localhost

# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}


# JPA
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.defer-datasource-initialization=false

# Hibernate
spring.jpa.hibernate.ddl-auto=validate

# Logging
logging.level.org.springframework=WARN


# =============================
# Gmail SMTP Mail Configuration
# =============================

spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

# Enable authentication and TLS
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Optional: Debug logs for troubleshooting
spring.mail.properties.mail.debug=false

# Optional: Connection timeout settings
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# JWT Configuration
app.jwt.issuer=${JWT_ISSUER:http://your-domain.com}
app.jwt.audience=${JWT_AUDIENCE:your-clients}
app.jwt.access-ttl=${JWT_ACCESS_TTL:15}
app.jwt.refresh-ttl=${JWT_REFRESH_TTL:14}
app.jwt.key-rotation-cron=${JWT_ROTATION_CRON:0 0 0 1 * *}

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://your-frontend.com}
app.cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
app.cors.allowed-headers=${CORS_ALLOWED_HEADERS:*}
app.cors.allow-credentials=${CORS_ALLOW_CREDENTIALS:true}
app.cors.max-age=${CORS_MAX_AGE:3600}